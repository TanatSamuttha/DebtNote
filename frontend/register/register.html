<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="register.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Document</title>
</head>
<body>
    <div class="information-block">
        <h3 class="register-header">Register</h3>
        <form id="register-form">
            <div>
                <h4 class="explain-text">username</h4>
                <input class="fill-box" id="username" name="username">
            </div>
            <div>
                <h4 class="explain-text">password</h4>
                <input class="fill-box" id="password" name="password" type="password">
            </div>
            <button type="submit" class="register-button">Register</button>
        </form>
        <p>Already have an account? <a href="/login/login.html">Register</a></p>
    </div>
    <script src="register.js"></script>
</body>
</html>
